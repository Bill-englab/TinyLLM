<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TinyLLM · AI Infra 课程课件</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav><div class="navin">
  <a class="brand" href="index.html">🎓 TinyLLM 课程</a>
  <span class="crumb">课件中心</span>
  <div class="grow"></div>
  <a class="pg" href="../dashboard.html">📊 进度台</a>
  <a class="pg" href="../plans/课程大纲.md" onclick="alert('Markdown 请用编辑器/预览器打开');return false">📚 课程大纲</a>
</div></nav>
<div class="wrap">
  <article>
    <h1>课件中心</h1>
    <div class="metabox"><span>8 篇 47 讲</span><span>滚动备课:学完一篇,制作下一篇</span><span>勾选与进度台同步</span></div>
    <p class="lead" style="background:#fff;border:1px solid var(--line)">
      每一讲的学法:读课件 → 做实践(产出物入库)→ 过自测 → 点页面底部的完成按钮。
      卡住随时回到对话提问;学完一篇,把实验日志和问题交给老师,一起写博客沉淀。
    </p>
    <div class="grid" id="grid"></div>
    <footer>
      课件与 <a href="../dashboard.html">进度台</a> 共享本地进度 ·
      内容源:<a href="../plans/课程大纲.md">课程大纲</a> ·
      篇级权威进度:<a href="../progress/PROGRESS.md">PROGRESS</a>
    </footer>
  </article>
</div>
<script src="course.js"></script>
<script>
/* 课程结构(与课程大纲同源);page=null 表示课件待制作(滚动备课) */
const PARTS=[
 {num:0,title:"第0篇 · 热身与已有基础",goal:"把阶段1/1.5/2从『做过』变成『能讲出来』",page:"p0.html",lessons:[
   {id:"0.1",t:"课程总览与学习方法",href:"p0.html"},
   {id:"0.2",t:"复习·模型部署",href:"p0.html"},
   {id:"0.3",t:"复习·推理环境",href:"p0.html"},
   {id:"0.4",t:"复习·量化初探",href:"p0.html"}]},
 {num:1,title:"第1篇 · GPU 体系结构与测量 ★地基",goal:"后面每一篇的结论都用本篇的工具验证",page:"p1-1.html",lessons:[
   {id:"1.1",t:"GPU 计算模型:SM、warp 与 Tensor Core",href:"p1-1.html"},
   {id:"1.2",t:"内存层级:寄存器→共享内存→L2→HBM",href:"p1-2.html"},
   {id:"1.3",t:"实测你的 3070:带宽与算力",href:"p1-3.html"},
   {id:"1.4",t:"Roofline 模型与算术强度",href:"p1-4.html"},
   {id:"1.5",t:"★LLM decode 为什么 memory-bound",href:"p1-5.html"},
   {id:"1.6",t:"Profiler 入门:nsys 与 torch profiler",href:"p1-6.html"},
   {id:"1.7",t:"统一基准 harness",href:"p1-7.html"}]},
 {num:2,title:"第2篇 · 推理引擎核心机制 ★面试核心",goal:"KV cache / 批调度 / PagedAttention / 投机采样",page:null,lessons:[
   {id:"2.1",t:"prefill vs decode"},{id:"2.2",t:"★KV Cache 推导与实测"},{id:"2.3",t:"Continuous Batching"},
   {id:"2.4",t:"★PagedAttention 论文+源码"},{id:"2.5",t:"Prefix Caching 与 Chunked Prefill"},
   {id:"2.6",t:"投机采样实验"},{id:"2.7",t:"vLLM vs llama.cpp"}]},
 {num:3,title:"第3篇 · 量化技术体系",goal:"GPTQ 原理 / AWQ / KV 量化 / 评估方法论",page:null,lessons:[
   {id:"3.1",t:"量化数学"},{id:"3.2",t:"动态量化与 outlier"},{id:"3.3",t:"★GPTQ 原理深入"},
   {id:"3.4",t:"AWQ 与 SmoothQuant"},{id:"3.5",t:"KV Cache 量化"},{id:"3.6",t:"7B 量化 serving"},{id:"3.7",t:"lm-eval 评估"}]},
 {num:4,title:"第4篇 · Kernel 与编译优化",goal:"Triton / FlashAttention / compile / CUDA Graphs",page:null,lessons:[
   {id:"4.1",t:"CUDA 执行模型"},{id:"4.2",t:"Triton 实践"},{id:"4.3",t:"★FlashAttention"},
   {id:"4.4",t:"torch.compile"},{id:"4.5",t:"CUDA Graphs"}]},
 {num:5,title:"第5篇 · 训练与模型适配",goal:"显存算术 / SFT / QLoRA / 蒸馏×投机采样",page:null,lessons:[
   {id:"5.1",t:"★训练显存算术"},{id:"5.2",t:"混合精度与检查点"},{id:"5.3",t:"SFT 全流程"},
   {id:"5.4",t:"QLoRA 实战"},{id:"5.5",t:"蒸馏联动投机采样"},{id:"5.6",t:"分布式训练概念"}]},
 {num:6,title:"第6篇 · 服务化与生产部署",goal:"API / 容器 / 监控 / 回归 CI / 负载均衡",page:null,lessons:[
   {id:"6.1",t:"API 服务化"},{id:"6.2",t:"容器化"},{id:"6.3",t:"监控体系"},
   {id:"6.4",t:"性能回归 CI"},{id:"6.5",t:"负载均衡"},{id:"6.6",t:"生产架构概念"}]},
 {num:7,title:"第7篇 · 分布式与前沿 + 毕业项目",goal:"NCCL / TP·PP / PD 分离 / 前沿 / 毕业",page:null,lessons:[
   {id:"7.1",t:"集合通信"},{id:"7.2",t:"张量/流水线并行"},{id:"7.3",t:"PD 分离论文"},
   {id:"7.4",t:"前沿选读"},{id:"7.5",t:"🎓 毕业项目"}]}];

const S=getS();
function done(l){const s=S[l.id]||{};return s.t&&s.p}
document.getElementById('grid').innerHTML=PARTS.map(p=>{
  const d=p.lessons.filter(done).length,n=p.lessons.length;
  const avail=!!p.page;
  const stTag=avail?'<span class="st ok">课件就绪</span>':'<span class="st todo">待制作(滚动备课)</span>';
  const lis=p.lessons.map(l=>{
    const s=S[l.id]||{};
    const mark=(s.t&&s.p)?'<span class="ok">✓</span>':((s.t||s.p)?'<span style="color:#2563eb">◐</span>':'<span class="no">·</span>');
    const title=avail&&l.href?`<a href="${l.href}">${l.id} ${l.t}</a>`:`${l.id} ${l.t}`;
    return `<li>${mark} ${title}</li>`}).join('');
  const card=avail?`<div class="pcard avail" onclick="location.href='${p.page}'">${stTag}
    <h3>${p.title}</h3><div class="goal">${p.goal}</div>${lis}
    <div class="bar"><i style="width:${d/n*100}%"></i></div>
    <div class="pbar-txt">${d}/${n} 讲完成</div></div>`
   :`<div class="pcard">${stTag}<h3>${p.title}</h3><div class="goal">${p.goal}</div>${lis}
    <div class="bar"><i style="width:${d/n*100}%"></i></div>
    <div class="pbar-txt">${d}/${n} 讲完成 · 课件学完上一篇后制作</div></div>`;
  return card}).join('');
</script>
</body>
</html>
