<head>

<title>TinyLLM · AI Infra 课程进度台</title>
<style>
:root{

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;

.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);

.hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hd h1{font-size:18px;font-weight:700}
.hd .sub{font-size:12px;color:var(--sub)}
.hd-right{margin-left:auto;display:flex;gap:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 14px;
  font-size:13px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.totalbar{margin-top:10px}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--done));
  border-radius:99px;transition:width .4s}
.totalbar .txt{font-size:12px;color:var(--sub);margin-top:4px;display:flex;justify-content:space-between}
section{margin-top:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
/* hero 当前位置 */
#hero .tag{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.1em}
#hero .now{font-size:20px;font-weight:700;margin:6px 0 4px}
#hero .desc{font-size:13px;color:var(--sub)}
#hero .acts{margin-top:10px;font-size:13px;color:var(--ink)}
/* 地图 */
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative}
.pcard:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(30,41,59,.08)}
.pcard .pt{font-size:13px;font-weight:700}
.pcard .pg{font-size:11px;color:var(--sub);margin:2px 0 8px;min-height:28px}
.pcard .bar{height:6px}
.pcard .cnt{font-size:11px;color:var(--sub);margin-top:4px}
.pcard.st-done{border-color:var(--done)} .pcard.st-done .pt{color:var(--done)}
.pcard.st-act{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pcard .st{position:absolute;top:10px;right:12px;font-size:11px;font-weight:700}
.st-done .st{color:var(--done)} .st-act .st{color:var(--accent)}
/* 篇 section */
.part-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:34px 0 12px}
.part-head .pn{font-size:13px;font-weight:800;color:#fff;background:var(--accent);
  border-radius:8px;padding:2px 10px}
.part-head h2{font-size:17px;font-weight:800}
.part-head .pinfo{font-size:12px;color:var(--sub)}
.part-head .pbar{margin-left:auto;min-width:160px}
.part-head .pbar .cnt{font-size:11px;color:var(--sub);text-align:right}

.lesson{background:var(--card);border:1px solid var(--line);border-radius:12px;
  margin-bottom:8px;overflow:hidden;transition:border-color .2s}
.lesson.l-done{border-color:var(--done)}
.lesson.l-part{border-color:var(--accent)}
.lrow{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;user-select:none}
.lrow:hover{background:#fafbfd}
.cbx{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--sub);
  cursor:pointer;padding:2px 6px;border-radius:6px;border:1px solid var(--line);
  background:#fff;white-space:nowrap}
.cbx.on{color:var(--done);border-color:var(--done);background:var(--done-soft);font-weight:700}
.cbx input{display:none}
.lnum{font-size:12px;font-weight:800;color:var(--accent);min-width:30px}
.ltitle{font-size:14px;font-weight:600;flex:1}
.l-done .ltitle{color:var(--sub);text-decoration:line-through;text-decoration-color:#cbd5e1}
.badge{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--chip);color:var(--sub);white-space:nowrap}
.badge.core{background:var(--core-soft);color:var(--core);font-weight:700}
.badge.lab{background:var(--accent-soft);color:var(--accent)}
.badge.review{background:#fef9c3;color:#a16207}
.badge.concept{background:#fce7f3;color:#be185d}
.chev{color:var(--sub);font-size:12px;transition:transform .2s}
.lesson.open .chev{transform:rotate(180deg)}
.detail{display:none;padding:4px 18px 16px;border-top:1px dashed var(--line)}
.lesson.open .detail{display:block}
.detail h4{font-size:12px;color:var(--accent);margin:12px 0 4px;font-weight:700;letter-spacing:.05em}
.detail ul,.detail ol{padding-left:20px;font-size:13px;color:var(--ink)}
.detail li{margin:3px 0}
.detail .art{font-size:13px;background:var(--chip);border-radius:8px;padding:8px 12px;margin-top:10px}
.detail .art b{font-size:12px;color:var(--sub);display:block}
footer{margin-top:40px;font-size:12px;color:var(--sub);text-align:center}
footer a{color:var(--accent);text-decoration:none}
/* modal */
#modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;
  align-items:center;justify-content:center;padding:20px}
#modal.show{display:flex}
.mbox{background:#fff;border-radius:14px;max-width:640px;width:100%;padding:20px;max-height:80vh;display:flex;flex-direction:column}
.mbox h3{font-size:15px;margin-bottom:10px}
.mbox textarea{flex:1;min-height:300px;font-family:Consolas,monospace;font-size:12px;
  border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
.mbox .mrow{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
@media(max-width:640px){.lrow{flex-wrap:wrap}.part-head .pbar{margin-left:0;width:100%}}
</style>
</head>

/* ================= 状态 ================= */
const KEY='tinyllm-course-v1';
let S={};try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){S={}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function st(id){return S[id]||{t:false,p:false}}
function setP(id,f,v){S[id]=Object.assign({t:false,p:false},S[id]);S[id][f]=v;save();render()}
function done(l){const s=st(l.id);return s.t&&s.p}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

const BADGE={理论:'',实践:'lab',复习:'review',核心:'core',概念:'concept',综合:'core'};

function render(){
  const total=P.reduce((a,p)=>a+p.lessons.length,0);
  const doneN=P.reduce((a,p)=>a+p.lessons.filter(done).length,0);
  const tN=P.reduce((a,p)=>a+p.lessons.filter(l=>st(l.id).t).length,0);
  const pN=P.reduce((a,p)=>a+p.lessons.filter(l=>st(l.id).p).length,0);
  const hrs=P.reduce((a,p)=>a+p.lessons.reduce((b,l)=>b+l.h,0),0);
  const dhrs=P.reduce((a,p)=>a+p.lessons.filter(done).reduce((b,l)=>b+l.h,0),0);
  document.getElementById('tbar').style.width=(doneN/total*100)+'%';
  document.getElementById('ttxt').textContent=`总进度:${doneN}/${total} 讲(${Math.round(doneN/total*100)}%)· 已投入约 ${dhrs}/${hrs} 小时`;
  document.getElementById('tsub').textContent=`理论 ${tN}/${total} · 实践 ${pN}/${total}`;

  /* hero: 第一个未完成讲 */
  let cur=null,curPart=null;
  outer:for(const p of P){for(const l of p.lessons){if(!done(l)){cur=l;curPart=p;break outer}}}
  const hero=document.getElementById('hero');
  if(!cur){hero.innerHTML=`<span class="tag">🎓 课程完成</span>
    <div class="now">全部 ${total} 讲已完成!</div>
    <div class="desc">毕业项目答辩通过后,记得在 PROGRESS.md 记录里程碑,并把面试速查过一遍。</div>`}
  else{const s=st(cur.id);const need=[];if(!s.t)need.push('📖 理论');if(!s.p)need.push('🔬 实践');
    hero.innerHTML=`<span class="tag">📍 你现在在这里 · ${esc(curPart.title)}</span>
    <div class="now">${cur.id} ${esc(cur.t)}</div>
    <div class="desc">${esc(curPart.goal)} · 代码目录:${esc(curPart.dir)}</div>
    <div class="acts">下一步:${need.join(' → ')} 完成后勾选 ·
      <a href="#" onclick="jumpTo('${cur.id}');return false" style="color:var(--accent)">展开本讲 ↓</a></div>`}

  /* map */
  document.getElementById('map').innerHTML=P.map(p=>{
    const d=p.lessons.filter(done).length,n=p.lessons.length;
    const cls=d===n?'st-done':(d>0?'st-act':'');
    const label=d===n?'✓ 完成':(d>0?'进行中':'未开始');
    return `<div class="pcard ${cls}" onclick="document.getElementById('part-${p.num}').scrollIntoView({behavior:'smooth'})">
      <span class="st">${label}</span>
      <div class="pt">第${p.num}篇 · ${esc(p.title)}</div>
      <div class="pg">${esc(p.goal)}</div>
      <div class="bar"><i style="width:${d/n*100}%;background:${d===n?'var(--done)':'var(--accent)'}"></i></div>
      <div class="cnt">${d}/${n} 讲 · 约 ${p.lessons.reduce((a,l)=>a+l.h,0)}h</div></div>`}).join('');

  /* course sections */
  document.getElementById('course').innerHTML=P.map(p=>{
    const d=p.lessons.filter(done).length,n=p.lessons.length;
    return `<div id="part-${p.num}">
      <div class="part-head"><span class="pn">第 ${p.num} 篇</span><h2>${esc(p.title)}</h2>
        <span class="pinfo">${esc(p.dir)}</span>
        <div class="pbar"><div class="bar"><i style="width:${d/n*100}%;background:${d===n?'var(--done)':'var(--accent)'}"></i></div>
        <div class="cnt">${d}/${n} 讲</div></div></div>
      ${p.lessons.map(l=>{
        const s=st(l.id),isD=s.t&&s.p,isP=s.t||s.p;
        return `<div class="lesson ${isD?'l-done':(isP?'l-part':'')}" id="L${l.id}">
        <div class="lrow" onclick="toggleL('${l.id}',event)">
          <label class="cbx ${s.t?'on':''}" onclick="event.stopPropagation()">
            <input type="checkbox" ${s.t?'checked':''} onchange="setP('${l.id}','t',this.checked)">理论</label>
          <label class="cbx ${s.p?'on':''}" onclick="event.stopPropagation()">
            <input type="checkbox" ${s.p?'checked':''} onchange="setP('${l.id}','p',this.checked)">实践</label>
          <span class="lnum">${l.id}</span>
          <span class="ltitle">${esc(l.t)}</span>
          <span class="badge ${BADGE[l.k]||''}">${l.k}</span>
          <span class="badge">${l.h}h</span>
          <span class="chev">▾</span></div>
        <div class="detail">
          <h4>📖 理论要点</h4><ul>${l.th.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
          <h4>🔬 实践任务</h4><ul><li>${esc(l.lab)}</li></ul>
          <h4>✅ 面试自测(能脱稿回答再勾理论)</h4>
          <ol>${l.qz.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
          <div class="art"><b>产出物(实践勾选标准:已入库)</b>${esc(l.art)}</div>
        </div></div>`}).join('')}</div>`}).join('');
}
function toggleL(id,e){if(e&&e.target.tagName==='INPUT')return;
  document.getElementById('L'+id).classList.toggle('open')}
function jumpTo(id){const el=document.getElementById('L'+id);if(!el)return;
  el.classList.add('open');el.scrollIntoView({behavior:'smooth',block:'center'})}
function resetAll(){if(confirm('确定清空全部本地进度?此操作不可恢复(建议先导出快照)。')){
  S={};save();render()}}

function exportSnap(){
  const total=P.reduce((a,p)=>a+p.lessons.length,0);
  const doneN=P.reduce((a,p)=>a+p.lessons.filter(done).length,0);
  const tN=P.reduce((a,p)=>a+p.lessons.filter(l=>st(l.id).t).length,0);
  const pN=P.reduce((a,p)=>a+p.lessons.filter(l=>st(l.id).p).length,0);
  let cur='(全部完成 🎓)';
  outer:for(const p of P)for(const l of p.lessons)if(!done(l)){cur=`第${p.num}篇 · ${l.id} ${l.t}`;break outer}
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const ts=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  let md=`## 课程进度快照 · ${ts}\n\n- 总进度:${doneN}/${total} 讲(${Math.round(doneN/total*100)}%)· 理论 ${tN}/${total} · 实践 ${pN}/${total}\n- 当前位置:${cur}\n\n`;
  for(const p of P){const d=p.lessons.filter(done).length;
    md+=`### 第${p.num}篇 ${p.title}(${d}/${p.lessons.length})\n\n`;
    md+=`| 讲 | 标题 | 理论 | 实践 |\n|----|------|:---:|:---:|\n`;
    for(const l of p.lessons){const s=st(l.id);
      md+=`| ${l.id} | ${l.t} | ${s.t?'✅':'·'} | ${s.p?'✅':'·'} |\n`}
    md+='\n'}
  md+=`> 来源:docs/dashboard.html 导出 · 粘贴到 PROGRESS.md 更新日志后可删除旧快照\n`;
  document.getElementById('snap').value=md;
  document.getElementById('modal').classList.add('show')}
function copySnap(){const ta=document.getElementById('snap');ta.select();
  try{navigator.clipboard.writeText(ta.value).then(()=>alert('已复制')).catch(()=>{document.execCommand('copy');alert('已复制')})}
  catch(e){document.execCommand('copy');alert('已复制')}}
render();
</script>
